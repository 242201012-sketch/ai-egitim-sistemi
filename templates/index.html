<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>AI Eğitim Sistemi</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    {% if current_user.is_authenticated %}

        <h1>Hoş Geldin {{ current_user.username }}</h1>

        <p>Giriş başarılı.</p>

        <a href="{{ url_for('logout') }}">
            Çıkış Yap
        </a>

    {% else %}

        <h1>AI Eğitim Sistemi</h1>

        <p>Giriş yap veya kayıt ol.</p>

        <a href="{{ url_for('login') }}">
            Giriş Yap
        </a>

        <br><br>

        <a href="{{ url_for('register') }}">
            Kayıt Ol
        </a>

    {% endif %}

</div>

</body>
</html>
