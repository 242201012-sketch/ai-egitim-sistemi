<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>AI Teacher</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="ai-container">

    <h1>🤖 AI Teacher</h1>

    <p class="subtitle">
        İstediğin konuda soru üret, öğren ve kendini test et.
    </p>

    <form method="POST">

        <label>
            <input
                type="text"
                name="topic"
                placeholder="Örn: Python, SQL, Veri Yapıları..."
                required>
        </label>

        <button type="submit">
            Quiz Üret
        </button>

    </form>

    {% if result %}

    <div class="result-box">

        <h2>AI Cevabı</h2>

        <pre>{{ result }}</pre>

    </div>

    {% endif %}

</div>

</body>
</html>
